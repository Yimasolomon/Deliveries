<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Delivery Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="container">
        <h1>Delivery Tracking Dashboard</h1>

```
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/deliveries">Deliveries</a>
    </nav>
</div>
```

</header>

<main class="container">

```
<div class="page-header">
    <div>
        <h2>Edit Delivery</h2>
        <p>
            Update delivery details for
            <strong>{{ delivery.tracking_number }}</strong>.
        </p>
    </div>

    <a href="/deliveries/{{ delivery.id }}" class="button secondary">
        Back to Delivery
    </a>
</div>

{% if error %}
<div class="alert error">
    {{ error }}
</div>
{% endif %}

<section class="card">

    <form
        method="post"
        action="/deliveries/{{ delivery.id }}/edit"
    >

        <div class="form-group">
            <label for="customer_id">Customer</label>

            <select
                id="customer_id"
                name="customer_id"
                required
            >
                <option value="">Select customer</option>

                {% for customer in customers %}
                <option
                    value="{{ customer.id }}"
                    {% if delivery.customer_id == customer.id %}
                    selected
                    {% endif %}
                >
                    {{ customer.name }} — {{ customer.phone }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="driver_id">Driver</label>

            <select
                id="driver_id"
                name="driver_id"
            >
                <option value="">Unassigned</option>

                {% for driver in drivers %}
                <option
                    value="{{ driver.id }}"
                    {% if delivery.driver_id == driver.id %}
                    selected
                    {% endif %}
                >
                    {{ driver.name }} — {{ driver.vehicle_number }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="pickup_address">
                Pickup Address
            </label>

            <input
                type="text"
                id="pickup_address"
                name="pickup_address"
                value="{{ delivery.pickup_address }}"
                placeholder="Enter pickup address"
                required
            >
        </div>

        <div class="form-group">
            <label for="delivery_address">
                Delivery Address
            </label>

            <input
                type="text"
                id="delivery_address"
                name="delivery_address"
                value="{{ delivery.delivery_address }}"
                placeholder="Enter delivery address"
                required
            >
        </div>

        <div class="form-group">
            <label for="scheduled_at">
                Scheduled Date & Time
            </label>

            <input
                type="datetime-local"
                id="scheduled_at"
                name="scheduled_at"
                value="{% if delivery.scheduled_at %}{{ delivery.scheduled_at.strftime('%Y-%m-%dT%H:%M') }}{% endif %}"
            >
        </div>

        <div class="form-actions">
            <a
                href="/deliveries/{{ delivery.id }}"
                class="button secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button primary"
            >
                Save Changes
            </button>
        </div>

    </form>

</section>
```

</main>

<script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>
</html>
