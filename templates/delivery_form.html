<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Delivery Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="container">
        <h1>Delivery Tracking Dashboard</h1>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/deliveries">Deliveries</a>
        </nav>
    </div>
</header>

<main class="container">

    <div class="page-header">
        <div>
            <h2>New Delivery</h2>
            <p>Create a new delivery record.</p>
        </div>

        <a href="/deliveries" class="button secondary">
            Back to Deliveries
        </a>
    </div>

    {% if error %}
    <div class="alert error">
        {{ error }}
    </div>
    {% endif %}

    <section class="card">

        <form method="post" action="/deliveries">

            <div class="form-group">
                <label for="customer_id">Customer</label>

                <select
                    id="customer_id"
                    name="customer_id"
                    required
                >
                    <option value="">Select customer</option>

                    {% for customer in customers %}
                    <option
                        value="{{ customer.id }}"
                        {% if form_data.get('customer_id') == customer.id %}
                        selected
                        {% endif %}
                    >
                        {{ customer.name }} — {{ customer.phone }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="driver_id">Driver</label>

                <select
                    id="driver_id"
                    name="driver_id"
                >
                    <option value="">Unassigned</option>

                    {% for driver in drivers %}
                    <option
                        value="{{ driver.id }}"
                        {% if form_data.get('driver_id') == driver.id %}
                        selected
                        {% endif %}
                    >
                        {{ driver.name }} — {{ driver.vehicle_number }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="pickup_address">
                    Pickup Address
                </label>

                <input
                    type="text"
                    id="pickup_address"
                    name="pickup_address"
                    value="{{ form_data.get('pickup_address', '') }}"
                    placeholder="Enter pickup address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="delivery_address">
                    Delivery Address
                </label>

                <input
                    type="text"
                    id="delivery_address"
                    name="delivery_address"
                    value="{{ form_data.get('delivery_address', '') }}"
                    placeholder="Enter delivery address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="scheduled_at">
                    Scheduled Date & Time
                </label>

                <input
                    type="datetime-local"
                    id="scheduled_at"
                    name="scheduled_at"
                    value="{{ form_data.get('scheduled_at', '') }}"
                >
            </div>

            <div class="form-actions">
                <a href="/deliveries" class="button secondary">
                    Cancel
                </a>

                <button type="submit" class="button primary">
                    Create Delivery
                </button>
            </div>

        </form>

    </section>

</main>

<script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>
</html>
