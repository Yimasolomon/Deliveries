<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon.png') }}">
    <title>Edit Driver - Delivery Tracking Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Delivery Tracking Dashboard</h1>

            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/deliveries">Deliveries</a>
                <a href="/customers">Customers</a>
                <a href="/drivers">Drivers</a>
                <a href="/reports">Reports</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Edit Driver</h1>
        <p>Update driver information.</p>

        <a
            href="/drivers/{{ driver.id }}"
            class="button secondary"
        >
            Back to Driver
        </a>

        {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="post"
            action="/drivers/{{ driver.id }}/edit"
            class="form-card"
        >
            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    value="{{ driver.name }}"
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    required
                    value="{{ driver.phone }}"
                >
            </div>

            <div class="form-group">
                <label for="vehicle_type">Vehicle Type</label>
                <input
                    type="text"
                    id="vehicle_type"
                    name="vehicle_type"
                    required
                    value="{{ driver.vehicle_type }}"
                >
            </div>

            <div class="form-group">
                <label for="vehicle_number">Vehicle Number</label>
                <input
                    type="text"
                    id="vehicle_number"
                    name="vehicle_number"
                    required
                    value="{{ driver.vehicle_number }}"
                >
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option
                        value="available"
                        {% if driver.status == "available" %}selected{% endif %}
                    >
                        Available
                    </option>

                    <option
                        value="busy"
                        {% if driver.status == "busy" %}selected{% endif %}
                    >
                        Busy
                    </option>

                    <option
                        value="unavailable"
                        {% if driver.status == "unavailable" %}selected{% endif %}
                    >
                        Unavailable
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary">
                    Save Changes
                </button>

                <a
                    href="/drivers/{{ driver.id }}"
                    class="button secondary"
                >
                    Cancel
                </a>
            </div>
        </form>
    </main>
</body>
</html>
