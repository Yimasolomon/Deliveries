
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Delivery Dashboard</title>
</head>
<body>

<h1>Create Customer Account</h1>

<p>Register to use the Delivery Tracking Dashboard.</p>

{% if error %}
<div role="alert" style="color: red;">
    {{ error }}
</div>
{% endif %}

<form method="post" action="/register">

    <div>
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ form_data.name if form_data else '' }}"
            required
        >
    </div>

    <div>
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ form_data.email if form_data else '' }}"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <div>
        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ form_data.phone if form_data else '' }}"
            required
        >
    </div>

    <div>
        <label for="address">Address</label>
        <input
            type="text"
            id="address"
            name="address"
            value="{{ form_data.address if form_data else '' }}"
            required
        >
    </div>

    <button type="submit">
        Create Account
    </button>

</form>

<p>
    Already have an account?
    <a href="/login">Login</a>
</p>

</body>
</html>
