<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{{ page_title }} - Delivery Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<header class="topbar">
    <div class="container">
        <h1>Delivery Tracking Dashboard</h1>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/deliveries">Deliveries</a>
            <a href="/customers">Customers</a>
        </nav>
    </div>
</header>

<main class="container">

    <div class="page-header">

        <div>
            <h2>Edit Customer</h2>

            <p>
                Update
                <strong>{{ customer.name }}</strong>.
            </p>
        </div>

        <a
            href="/customers/{{ customer.id }}"
            class="button secondary"
        >
            Back to Customer
        </a>

    </div>

    {% if error %}
    <div class="alert error">
        {{ error }}
    </div>
    {% endif %}

    <section class="card">

        <form
            method="post"
            action="/customers/{{ customer.id }}/edit"
        >

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ customer.name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ customer.phone }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ customer.email or '' }}"
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    value="{{ customer.address }}"
                    required
                >
            </div>

            <div class="form-actions">

                <a
                    href="/customers/{{ customer.id }}"
                    class="button secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="button primary"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
